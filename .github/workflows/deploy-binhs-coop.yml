name: Deploy binhs-coop (backend)

# Manual-only deploys for the binhs-coop client API instance.
#   staging    -> api.binhs-coop-staging.lendyph.com  (/var/www/binhs-coop-backend-staging, branch development)
#   production -> api.binhs-coop.lendyph.com           (/var/www/binhs-coop-backend, branch main)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which binhs-coop API environment to deploy
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy binhs-coop API ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            if [ "${{ inputs.environment }}" = "production" ]; then
              bash /var/www/binhs-coop-backend/deploy.sh
            else
              bash /var/www/binhs-coop-backend-staging/deploy.sh
            fi

      # The VPS has intermittently flaky inbound SSH (dial tcp :22 i/o timeout).
      # deploy.sh is idempotent, so retry once to ride out transient blips.
      - name: Deploy to VPS via SSH (retry on transient failure)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: |
            set -e
            if [ "${{ inputs.environment }}" = "production" ]; then
              bash /var/www/binhs-coop-backend/deploy.sh
            else
              bash /var/www/binhs-coop-backend-staging/deploy.sh
            fi
