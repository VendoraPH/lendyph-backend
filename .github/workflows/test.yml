name: tests

# Runs the Pest suite on PRs, on pushes to the long-lived branches, and on
# merge-queue groups. deploy.yml uses `paths-ignore: ['.github/**']`, so
# editing this workflow does not trigger a deploy, and no deploy workflow
# listens for merge_group: the queue's temporary gh-readonly-queue/* branch is
# tested here and deploys still run only on the push the queue makes when it
# merges.
on:
  pull_request:
  push:
    branches: [development, main]
  merge_group:
    branches: [development, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Layout (2026-11-09). The suite reached ~5,700 tests and one job took 15-21
# minutes, so it is split:
#
#   checks      Composer audit + Pint, once, beside the shards.
#   shard 1..4  Pest's own time-balanced sharding (--shard=i/4, timings in
#               tests/.pest/shards.json), each on its own runner and MySQL,
#               each with its own "Tests:" summary gate.
#   pest        The aggregate. It is the required status check, so its name
#               must stay exactly `pest`: it fails unless `checks` and every
#               shard succeeded, then sums the shards' passed counts against
#               the MIN_TESTS floor.
#
# A new test file that shards.json does not know yet still runs: Pest deals
# unknown files round-robin across the shards and prints a WARN. Refresh the
# timings now and then with `vendor/bin/pest --parallel --update-shards`
# (all green, on a quiet machine), and commit tests/.pest/shards.json.
jobs:
  checks:
    name: Composer audit and Pint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, mbstring, bcmath, intl, zip
          coverage: none

      - name: Cache vendor
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Nothing had ever audited dependencies here, so 33 advisories across 11
      # packages accumulated unseen — 8 of them high — including one against the
      # framework backing the KYC signed-URL mechanism. Cleaning that up once
      # only resets the clock; this is what stops it recurring.
      #
      # Fails on high/critical only. A medium or low advisory published upstream
      # overnight must not turn every unrelated PR red — a check that cries wolf
      # is one people learn to ignore, and this repo already learned that lesson
      # with the fleet drift check. Everything else is printed for visibility.
      - name: Audit Composer dependencies
        run: |
          # --locked audits composer.lock rather than the installed tree.
          # Without it, `composer audit` reports "No packages - skipping audit"
          # whenever vendor/ is absent — a silent pass that looks like a clean bill.
          composer audit --locked --format=json > audit.json || true
          php -r '
            $a = json_decode(file_get_contents("audit.json"), true)["advisories"] ?? [];
            $rows = [];
            foreach ($a as $pkg => $items) {
              foreach ($items as $i) {
                $rows[] = [strtolower($i["severity"] ?? "unknown"), $pkg, $i["cve"] ?? $i["advisoryId"] ?? "", $i["title"] ?? ""];
              }
            }
            $bad = array_filter($rows, fn ($r) => in_array($r[0], ["high", "critical"], true));
            foreach ($rows as $r) {
              printf("%-9s %-28s %-20s %s\n", $r[0], $r[1], $r[2], substr($r[3], 0, 90));
            }
            printf("\n%d advisories, %d high/critical\n", count($rows), count($bad));
            if ($bad) {
              fwrite(STDERR, "::error title=Vulnerable dependency::" . count($bad) . " high/critical advisory(ies) — run composer audit locally\n");
              exit(1);
            }
          '
          rm -f audit.json

      # Pint was already in require-dev but nothing ran it, so style drifted
      # silently. vendora-api has had this step since it was created; this is
      # the backport. Repo verified clean at 321 files when added — run
      # `vendor/bin/pint` to fix anything this flags.
      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

  shard:
    name: pest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # A stuck run used to burn an hour in silence: GitHub withholds the logs
    # until a run completes, so an unbounded job is also an unreadable one.
    # A shard takes a quarter of the suite; fail at 20 and hand back the log.
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one red shard doesn't hide another's failures.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      # MySQL is started as an explicit container (not a GitHub `services:` block)
      # because service containers can't override the command, and we need the
      # tmpfs + durability-off flags. Matches phpunit.xml: lendyph_testing / root /
      # empty password on 127.0.0.1:3306. It boots while PHP and Composer are
      # set up; "Wait for MySQL" below blocks only on what is left.
      - name: Start MySQL (tmpfs, durability off)
        run: |
          docker run -d --name mysql-test \
            -p 3306:3306 \
            --tmpfs /var/lib/mysql \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -e MYSQL_DATABASE=lendyph_testing \
            mysql:8.0 \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 \
            --skip-log-bin \
            --innodb-buffer-pool-size=512M \
            --lock-wait-timeout=120

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, mbstring, bcmath, intl, zip
          coverage: none

      - name: Cache vendor
        uses: actions/cache@v6
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 60); do
            if docker exec mysql-test mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL ready"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; docker logs mysql-test; exit 1

      - name: Run tests (shard ${{ matrix.shard }}/4, parallel)
        # Pest directly, not `php artisan test`: artisan adds Laravel's
        # --runner argument, which Pest's shard step then hands to a plain
        # `pest --list-tests` that refuses it. `pest --parallel` sets up the
        # same Laravel parallel runner and per-worker databases itself.
        #
        # Four worker processes, one per vCPU of a public repo's standard
        # runner. The count is ParaTest's default (the core count) because
        # Pest's shard step also refuses --processes; the old single job ran
        # --processes=4 on the same 4 vCPUs. Measured on 2026-10 with the
        # suite in transactions: 4 and 8 processes were at parity. Re-measure
        # here before changing it.
        #
        # The passed-count floor (MIN_TESTS) is checked once, on the sum of all
        # shards, by the `pest` job. Here a shard only has to finish, fail
        # nothing, and pass at least one test.
        env:
          SHARD: ${{ matrix.shard }}/4
        run: |
          set -uo pipefail

          # Captured, not trusted. The parallel run has exited 0 over real
          # failures (verified repeatedly on this project), so the exit code
          # cannot gate this job and the summary line has to be read instead.
          vendor/bin/pest --parallel --shard="$SHARD" 2>&1 | tee pest-output.log
          echo

          # Strip ANSI colour before matching. Pest writes "\e[90mTests:\e[39m",
          # so the escape sequence sits between the line start and the word and a
          # pattern anchored with ^[[:space:]]*Tests: matches NOTHING. That failure
          # is silent and reads exactly like a suite that never produced a summary,
          # which is the very thing this check exists to detect.
          sed -E 's/\x1b\[[0-9;]*m//g' pest-output.log > pest-output.plain.log

          summary="$(grep -aE '^[[:space:]]*Tests:' pest-output.plain.log | tail -1 || true)"

          if [ -z "$summary" ]; then
            echo "::error::Shard $SHARD produced no 'Tests:' summary line. It did not"
            echo "::error::finish - most likely it died mid-run (OOM, a worker crash,"
            echo "::error::or a fatal during bootstrap). A green exit code here means"
            echo "::error::nothing; see pest-output.log in this run's artifacts."
            exit 1
          fi

          echo "Summary: $summary"

          if echo "$summary" | grep -qaE 'failed|errored'; then
            echo "::error::Shard $SHARD: tests failed or errored: $summary"
            exit 1
          fi

          passed="$(echo "$summary" | sed -E 's/.*[^0-9]([0-9]+) passed.*/\1/')"
          case "$passed" in
            ''|*[!0-9]*)
              echo "::error::Could not read a passed count from: $summary"
              exit 1
              ;;
          esac

          if [ "$passed" -lt 1 ]; then
            echo "::error::Shard $SHARD passed no tests: $summary"
            exit 1
          fi

          echo "OK: shard $SHARD, $passed tests passed."

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pest-output-${{ matrix.shard }}
          path: |
            pest-output.log
            pest-output.plain.log
          if-no-files-found: ignore
          retention-days: 7

  pest:
    # The required status check. Keep the name exactly `pest`.
    name: pest
    needs: [checks, shard]
    # always(): a failed or cancelled shard must turn this red, not skip it. A
    # skipped required check reads as passing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every shard and check succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "checks: $CHECKS, shards: $SHARDS"
          if [ "$CHECKS" != success ] || [ "$SHARDS" != success ]; then
            echo "::error::A shard or the audit/Pint job did not succeed (checks: $CHECKS, shards: $SHARDS)."
            exit 1
          fi

      - name: Download shard output
        uses: actions/download-artifact@v7
        with:
          pattern: pest-output-*
          path: shards

      # MIN_TESTS is a FLOOR, not an expected count. The suite grows; this only
      # has to be high enough to catch a run that collapsed. Raise it when it
      # drifts far below the real total, and do not pin it to the exact number.
      - name: Passed-count floor across all shards
        env:
          MIN_TESTS: "5000"
          SHARD_COUNT: "4"
        run: |
          set -uo pipefail
          total=0
          found=0
          for f in shards/pest-output-*/pest-output.plain.log; do
            [ -f "$f" ] || continue
            summary="$(grep -aE '^[[:space:]]*Tests:' "$f" | tail -1 || true)"
            passed="$(echo "$summary" | sed -E 's/.*[^0-9]([0-9]+) passed.*/\1/')"
            case "$passed" in
              ''|*[!0-9]*)
                echo "::error::Could not read a passed count from $f: $summary"
                exit 1
                ;;
            esac
            echo "$f: $summary"
            total=$((total + passed))
            found=$((found + 1))
          done

          if [ "$found" -ne "$SHARD_COUNT" ]; then
            echo "::error::Found $found shard summaries, expected $SHARD_COUNT."
            exit 1
          fi

          if [ "$total" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $total tests ran across all shards, floor is $MIN_TESTS."
            echo "::error::Something stopped collecting tests - check for a bootstrap"
            echo "::error::failure or a suite/path change before lowering this floor."
            exit 1
          fi

          echo "OK: $total tests passed across $found shards (floor $MIN_TESTS)."
