name: tests

# Runs the Pest suite on PRs and on pushes to the long-lived branches.
# deploy.yml uses `paths-ignore: ['.github/**']`, so adding this workflow does
# not trigger a deploy.
on:
  pull_request:
  push:
    branches: [development, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    runs-on: ubuntu-latest
    # A stuck run used to burn an hour in silence: GitHub withholds the logs
    # until a run completes, so an unbounded job is also an unreadable one.
    # Fail at 45 and hand back the log instead.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # MySQL is started as an explicit container (not a GitHub `services:` block)
      # because service containers can't override the command, and we need the
      # tmpfs + durability-off flags. Matches phpunit.xml: lendyph_testing / root /
      # empty password on 127.0.0.1:3306.
      - name: Start MySQL (tmpfs, durability off)
        run: |
          docker run -d --name mysql-test \
            -p 3306:3306 \
            --tmpfs /var/lib/mysql \
            -e MYSQL_ALLOW_EMPTY_PASSWORD=yes \
            -e MYSQL_DATABASE=lendyph_testing \
            mysql:8.0 \
            --innodb-flush-log-at-trx-commit=0 \
            --innodb-doublewrite=0 \
            --skip-log-bin \
            --innodb-buffer-pool-size=512M \
            --lock-wait-timeout=120
          echo "Waiting for MySQL to accept connections..."
          for i in $(seq 1 60); do
            if docker exec mysql-test mysqladmin ping -h 127.0.0.1 --silent 2>/dev/null; then
              echo "MySQL ready"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready"; docker logs mysql-test; exit 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, mbstring, bcmath, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Nothing had ever audited dependencies here, so 33 advisories across 11
      # packages accumulated unseen — 8 of them high — including one against the
      # framework backing the KYC signed-URL mechanism. Cleaning that up once
      # only resets the clock; this is what stops it recurring.
      #
      # Fails on high/critical only. A medium or low advisory published upstream
      # overnight must not turn every unrelated PR red — a check that cries wolf
      # is one people learn to ignore, and this repo already learned that lesson
      # with the fleet drift check. Everything else is printed for visibility.
      - name: Audit Composer dependencies
        run: |
          # --locked audits composer.lock rather than the installed tree.
          # Without it, `composer audit` reports "No packages - skipping audit"
          # whenever vendor/ is absent — a silent pass that looks like a clean bill.
          composer audit --locked --format=json > audit.json || true
          php -r '
            $a = json_decode(file_get_contents("audit.json"), true)["advisories"] ?? [];
            $rows = [];
            foreach ($a as $pkg => $items) {
              foreach ($items as $i) {
                $rows[] = [strtolower($i["severity"] ?? "unknown"), $pkg, $i["cve"] ?? $i["advisoryId"] ?? "", $i["title"] ?? ""];
              }
            }
            $bad = array_filter($rows, fn ($r) => in_array($r[0], ["high", "critical"], true));
            foreach ($rows as $r) {
              printf("%-9s %-28s %-20s %s\n", $r[0], $r[1], $r[2], substr($r[3], 0, 90));
            }
            printf("\n%d advisories, %d high/critical\n", count($rows), count($bad));
            if ($bad) {
              fwrite(STDERR, "::error title=Vulnerable dependency::" . count($bad) . " high/critical advisory(ies) — run composer audit locally\n");
              exit(1);
            }
          '
          rm -f audit.json

      # Pint was already in require-dev but nothing ran it, so style drifted
      # silently. vendora-api has had this step since it was created; this is
      # the backport. Repo verified clean at 321 files when added — run
      # `vendor/bin/pint` to fix anything this flags.
      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests (parallel)
        # --processes stays at FOUR, but the old reason for it is no longer true
        # and has been replaced with a measured one.
        #
        # The previous note said "every test calls migrate:fresh
        # (SetupLendyPH.php), so more workers means more concurrent DROP/CREATE
        # against one server", measuring 6 workers (1080s) slower than 4 (1039s).
        # That regime is gone: the suite moved to RefreshDatabase, the schema is
        # built once per worker, and each test runs in a transaction. The DDL
        # bottleneck those figures came from no longer exists.
        #
        # Re-measured on the full suite, same machine, same image, back to back:
        # 4 processes 60.8s, 8 processes 61.2s, both 1873 passed. Parity, so
        # there is nothing to gain by raising it. Treat those as an upper bound
        # rather than a prediction for CI: this ran on a developer Mac, and a
        # GitHub standard runner has fewer cores, where 4 is already the
        # oversubscribed end. Re-measure here before changing the number.
        #
        # MIN_TESTS is a FLOOR, not an expected count. The suite grows; this only
        # has to be high enough to catch a run that collapsed. Raise it when it
        # drifts far below the real total, and do not pin it to the exact number.
        env:
          MIN_TESTS: "1800"
        run: |
          set -uo pipefail

          # Captured, not trusted. `artisan test` exits 0 over real failures
          # (verified repeatedly on this project), so the exit code cannot gate
          # this job and the summary line has to be read instead.
          php artisan test --parallel --processes=4 2>&1 | tee pest-output.log
          echo

          # Strip ANSI colour before matching. Pest writes "\e[90mTests:\e[39m",
          # so the escape sequence sits between the line start and the word and a
          # pattern anchored with ^[[:space:]]*Tests: matches NOTHING. That failure
          # is silent and reads exactly like a suite that never produced a summary,
          # which is the very thing this check exists to detect.
          sed -E 's/\x1b\[[0-9;]*m//g' pest-output.log > pest-output.plain.log

          summary="$(grep -aE '^[[:space:]]*Tests:' pest-output.plain.log | tail -1 || true)"

          if [ -z "$summary" ]; then
            echo "::error::The suite produced no 'Tests:' summary line. It did not"
            echo "::error::finish - most likely it died mid-run (OOM, a worker crash,"
            echo "::error::or a fatal during bootstrap). A green exit code here means"
            echo "::error::nothing; see pest-output.log in this run's artifacts."
            exit 1
          fi

          echo "Summary: $summary"

          if echo "$summary" | grep -qaE 'failed|errored'; then
            echo "::error::Tests failed or errored: $summary"
            exit 1
          fi

          passed="$(echo "$summary" | sed -E 's/.*[^0-9]([0-9]+) passed.*/\1/')"
          case "$passed" in
            ''|*[!0-9]*)
              echo "::error::Could not read a passed count from: $summary"
              exit 1
              ;;
          esac

          if [ "$passed" -lt "$MIN_TESTS" ]; then
            echo "::error::Only $passed tests ran, floor is $MIN_TESTS. The suite"
            echo "::error::did not collapse loudly, but it ran far less than it should."
            echo "::error::Something stopped collecting tests - check for a bootstrap"
            echo "::error::failure or a suite/path change before lowering this floor."
            exit 1
          fi

          echo "OK: $passed tests passed (floor $MIN_TESTS)."

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pest-output
          path: |
            pest-output.log
            pest-output.plain.log
          if-no-files-found: ignore
          retention-days: 7
