name: Deploy Staging API

# LendyPH SaaS — STAGING API.
#   domain : staging-api.lendyph.com
#   dir    : /var/www/lendyph-com-api-staging   (VPS 76.13.22.110)
#   branch : development                        (db: lendyph_com_staging)
#
# The on-VPS /var/www/lendyph-com-api-staging/deploy.sh owns the app-level work
# (fetch/reset, composer, migrate, storage:link --force, config/route cache,
# l5-swagger, chown www-data). This workflow invokes it and then adds the one
# host-level thing deploy.sh does not do: the Laravel scheduler crontab entry.
on:
  push:
    branches: [development]
    # CI-only changes (e.g. edits to these workflows) shouldn't redeploy staging.
    paths-ignore: ['.github/**']
  # Manual re-deploy path: re-runs the idempotent deploy against whatever
  # origin/development points at now, without needing an empty commit.
  workflow_dispatch:

# Two overlapping deploys would `git reset --hard` the checkout out from under
# a running composer install. Queue them instead of interleaving; never cancel
# a deploy mid-flight.
concurrency:
  group: deploy-staging-api
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging API (staging-api.lendyph.com)
    runs-on: ubuntu-latest

    # The on-VPS deploy script is defined once and reused by both the initial
    # attempt and the transient-failure retry below, so the two never drift.
    env:
      DEPLOY_SCRIPT: |
        set -e

        DEPLOY_DIR=/var/www/lendyph-com-api-staging
        DEPLOY_BRANCH=development

        # The proxy secret, delivered by the step before this one (staging only).
        # Exported so deploy.sh's children inherit it: never echoed, never on a
        # command line (sed gets only the path). Line 1 is the secret, line 2 the
        # source addresses the API accepts it from (empty: any).
        PROXY_SECRET_FILE="$HOME/.lendyph-proxy-secret/lendyph-com-api-staging"
        if [ -s "$PROXY_SECRET_FILE" ]; then
          LENDYPH_PROXY_SECRET="$(sed -n 1p "$PROXY_SECRET_FILE")"
          LENDYPH_PROXY_SOURCES="$(sed -n 2p "$PROXY_SECRET_FILE")"
          export LENDYPH_PROXY_SECRET LENDYPH_PROXY_SOURCES
          echo "proxy secret: loaded"
        else
          echo "NOTE: no proxy secret on the box; X-Forwarded-For stays untrusted."
        fi
        # config:cache (inside deploy.sh) rewrites bootstrap/cache/config.php at
        # 0644, and it now holds the proxy secret. Put it back to 0640 (www-data owns
        # it) when this script exits, also when deploy.sh fails. A user who can't
        # chmod it gets a warning, never a failed deploy.
        protect_config_cache() {
          f="$DEPLOY_DIR/bootstrap/cache/config.php"
          [ -f "$f" ] || return 0
          if chmod 640 "$f" 2>/dev/null; then
            echo "config cache: mode 640"
          else
            echo "::warning title=config.php left as is::could not chmod $f as $(id -un)"
          fi
        }
        trap protect_config_cache EXIT

        bash "$DEPLOY_DIR/deploy.sh"

        # --- Did this deploy actually land? -----------------------------------------
        # Nothing here used to assert the OUTCOME of a deploy. A green job proved that
        # ssh connected and the deploy script exited 0 — not that the checkout moved.
        # Every production verification this week was done by hand (reading /api/health,
        # or `git rev-parse HEAD` over ssh) precisely because the job could not answer
        # it: `Deploy Portfolio` failed with `dial tcp :22 i/o timeout` and its re-run
        # failed the same way, four attempts across two runs; five other jobs failed on
        # four occasions in one day and every one was fixed by a re-run with nothing
        # changed; and a `Deploy binhs-coop` run was once dropped outright by a shared
        # concurrency group, leaving the client's production frontend simply never
        # updated. A box left on old code still returns HTTP 200 and still looks
        # healthy from every angle except the deployed commit.
        #
        # Deliberately NOT an equality test against this run's commit. The deploy does
        # `git fetch origin <branch>` + `git reset --hard origin/<branch>`, so it ships
        # the branch tip AT THE MOMENT IT RUNS, not the commit that triggered this run;
        # and the concurrency group queues deploys rather than cancelling them, so a
        # queued older run can legitimately ship newer code. Ancestry is the honest
        # assertion: HEAD must CONTAIN this run's commit, and is allowed to be ahead.
        #
        # This lives in the workflow rather than in deploy.sh because the on-VPS scripts
        # are unversioned — they exist only on the box and can change without review.
        # This is the copy that goes through review.
        echo "=== Verifying $DEPLOY_DIR advanced to contain $EXPECTED_SHA ==="
        cd "$DEPLOY_DIR"

        if [ -z "${EXPECTED_SHA:-}" ]; then
          echo "DEPLOY VERIFICATION FAILED: EXPECTED_SHA never reached the box."
          echo "It travels via the ssh-action's envs: input — check it is listed there."
          exit 1
        fi

        DEPLOYED_SHA=$(git rev-parse HEAD)

        if [ "${EXPECTED_REF:-}" != "$DEPLOY_BRANCH" ]; then
          # This run's ref is NOT the branch this directory tracks, so this run's commit
          # is not expected to appear in this history at all and ancestry would be a
          # guaranteed false failure. Not hypothetically: workflow_dispatch defaults to
          # the repository's default branch, which is `main` in both repos, and `main`
          # is PERMANENTLY ahead of `development` here — every promotion merges
          # development -> main through a GitHub merge commit that is never merged back,
          # so origin/main's tip is by construction never an ancestor of development.
          # Measured 2026-09-16: 6 such commits in the backend, 10 in the frontend, with
          # 0 flowing the other way. A hand-dispatched staging deploy — which is how
          # binhs-coop is actually released — would therefore fail EVERY time on a
          # deploy that did exactly the right thing. `git fetch origin <branch>` also
          # fetches only that one ref, so the other branch's object may not exist on the
          # box at all (/var/www/binhs-coop-backend and /var/www/lendyph-backend have no
          # refs/remotes/origin/development), which would fail with a confusing
          # "Not a valid commit name" instead.
          #
          # Assert what is still true and still worth asserting: the reset landed on the
          # tip the deploy just fetched, in this same ssh session.
          echo "NOTE: this run is on '${EXPECTED_REF:-<unset>}' but $DEPLOY_DIR tracks '$DEPLOY_BRANCH',"
          echo "      so ancestry is not assertable here; asserting HEAD == origin/$DEPLOY_BRANCH instead."
          BRANCH_TIP=$(git rev-parse --verify --quiet "refs/remotes/origin/$DEPLOY_BRANCH" || true)
          if [ -z "$BRANCH_TIP" ] || [ "$DEPLOYED_SHA" != "$BRANCH_TIP" ]; then
            echo "DEPLOY VERIFICATION FAILED: HEAD is $DEPLOYED_SHA but origin/$DEPLOY_BRANCH is ${BRANCH_TIP:-<no such ref on this box>}."
            echo "The deploy reported success but the checkout is not on the tip it just fetched."
            exit 1
          fi
          echo "OK: $DEPLOY_DIR HEAD $DEPLOYED_SHA == origin/$DEPLOY_BRANCH"
        else
          # Checked separately from the ancestry test so a stale box gets a message that
          # says so, rather than git's "Not a valid commit name".
          if ! git cat-file -e "${EXPECTED_SHA}^{commit}" 2>/dev/null; then
            echo "DEPLOY VERIFICATION FAILED: $DEPLOY_DIR has no object for this run's commit $EXPECTED_SHA."
            echo "The fetch never brought it down, so this checkout cannot be serving it."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$DEPLOYED_SHA"; then
            echo "DEPLOY VERIFICATION FAILED: $DEPLOY_DIR is serving $DEPLOYED_SHA,"
            echo "which does not contain this run's commit $EXPECTED_SHA."
            echo "The deploy reported success but the checkout did not advance."
            exit 1
          fi
          echo "OK: $DEPLOY_DIR HEAD $DEPLOYED_SHA contains $EXPECTED_SHA"
        fi

        # --- Laravel scheduler cron (idempotent, scoped to THIS directory) ---
        # Three Lendyph backends share this VPS's single root crontab:
        #   /var/www/lendyph-com-api          -> api.lendyph.com          (production)
        #   /var/www/lendyph-com-api-staging  -> staging-api.lendyph.com  (staging)
        #   /var/www/lendyph-backend          -> api-lendyph.abedubas.dev (portfolio)
        # Each needs its OWN schedule:run entry, so the guard must match this
        # directory and nothing else. Matching through "&& php artisan
        # schedule:run" makes " &&" the terminator, so no path can be a prefix
        # of another (production's "/var/www/lendyph-com-api" is a prefix of
        # this one) — and it also won't be fooled by some unrelated cron that
        # happens to cd into the same directory.
        # flock serialises the read-modify-write: `crontab -l | ... | crontab -`
        # from two environments deploying at once would otherwise silently drop
        # whichever entry lost the race.
        export CRON_JOB="cd /var/www/lendyph-com-api-staging && php artisan schedule:run"
        export CRON_LINE="* * * * * $CRON_JOB >> /dev/null 2>&1"
        flock /var/lock/lendyph-scheduler-crontab.lock bash -c 'crontab -l 2>/dev/null | grep -qF "$CRON_JOB" || (crontab -l 2>/dev/null; echo "$CRON_LINE") | crontab -'

        # Fail loudly rather than leave staging running without a scheduler.
        crontab -l 2>/dev/null | grep -qF "$CRON_JOB"
        echo "scheduler cron present: $CRON_LINE"

        echo "Staging API deployed at $(date)"

    steps:
      # The proxy secret (staging only). It reaches the box over this SSH session's
      # STDIN, never in a command line: appleboy/ssh-action sends `envs:` as export
      # lines inside the remote `bash -c` script, and /proc/<pid>/cmdline is readable
      # by every user on this shared box for the whole deploy. It lands in a 0600
      # file in the deploy user's home, outside every web root; the deploy step
      # below exports it before deploy.sh (config:cache / pm2 restart --update-env).
      # Never fatal: without it the app keeps ignoring X-Forwarded-For, as today.
      - name: Deliver the proxy secret (staging only)
        id: proxy_secret
        continue-on-error: true
        env:
          PROXY_SECRET: ${{ secrets.PROXY_SECRET_LENDYPH_STAGING }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PROXY_SOURCES: ${{ secrets.PROXY_SOURCES_STAGING }}
        run: |
          set -euo pipefail
          if [ -z "$PROXY_SECRET" ]; then
            echo "::warning title=Proxy secret missing::PROXY_SECRET_LENDYPH_STAGING is not set; the box keeps its last one, if any."
            exit 1
          fi
          # Exactly 64 lowercase hex characters, as `openssl rand -hex 32` makes it.
          # Anything else is refused, a pasted trailing newline included: the
          # backend file's line 2 is the allowed-source list, and a stray newline
          # would push it to line 3, which nothing reads.
          secret_format='^[0-9a-f]{64}$'
          if ! [[ $PROXY_SECRET =~ $secret_format ]]; then
            echo "::warning title=Proxy secret not delivered::PROXY_SECRET_LENDYPH_STAGING is not exactly 64 lowercase hex characters (a trailing newline counts); the box keeps its last one, if any."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/vps_key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          # Pin the box's host key (VPS_KNOWN_HOSTS, from ssh-keyscan). Each stored
          # line is re-labelled with VPS_HOST, so it matches whatever name or
          # address that secret holds. No key, no connection.
          known="$RUNNER_TEMP/known_hosts"
          printf '%s\n' "${VPS_KNOWN_HOSTS:-}" | awk -v h="$VPS_HOST" 'NF >= 3 && $1 !~ /^#/ { print h, $2, $3 }' > "$known"
          if [ ! -s "$known" ]; then
            echo "::warning title=Host key missing::VPS_KNOWN_HOSTS holds no key; the proxy secret was not delivered."
            exit 1
          fi
          # Only paths in the remote command; the value is read from stdin by cat.
          remote="set -eu; umask 077; d=\"\$HOME/.lendyph-proxy-secret\"; mkdir -p \"\$d\"; chmod 700 \"\$d\"; f=\"\$d/lendyph-com-api-staging\"; cat > \"\$f.tmp\"; if [ ! -s \"\$f.tmp\" ]; then rm -f \"\$f.tmp\"; exit 1; fi; chmod 600 \"\$f.tmp\"; mv -f \"\$f.tmp\" \"\$f\"; echo 'proxy secret delivered'"
          # The allowed sources: IPv4 or IPv6 literals, comma-separated, on one
          # line. Unset is delivered as empty (any source, with a warning); a
          # malformed list is not delivered at all.
          if [ -z "${PROXY_SOURCES:-}" ]; then
            echo "::warning title=Proxy sources missing::PROXY_SOURCES_STAGING is not set; the API accepts the secret from any source."
          elif ! printf '%s' "$PROXY_SOURCES" | python3 -I -c 'import ipaddress, sys; v = sys.stdin.read(); sys.exit(1) if ("\n" in v or "\r" in v) else [ipaddress.ip_address(p.strip()) for p in v.split(",")]' 2>/dev/null; then
            echo "::warning title=Proxy secret not delivered::PROXY_SOURCES_STAGING must be IPv4 or IPv6 addresses, comma-separated, on one line; the box keeps its last secret and sources, if any."
            exit 1
          fi
          for attempt in 1 2 3; do
            # Line 1 the secret, line 2 the allowed source addresses.
            if printf '%s\n%s\n' "$PROXY_SECRET" "${PROXY_SOURCES:-}" | ssh -i "$key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" -o GlobalKnownHostsFile=/dev/null \
              -o ConnectTimeout=60 "$VPS_USER@$VPS_HOST" "$remote"; then
              exit 0
            fi
            echo "attempt $attempt to deliver the proxy secret failed"
            [ "$attempt" -lt 3 ] && sleep 60
          done
          exit 1

      - name: Deploy via SSH
        id: deploy
        uses: appleboy/ssh-action@v1
        # github.sha and github.ref_name reach the box through the action's
        # envs: input rather than being interpolated into the script text, so
        # the remote shell receives them as real variables and there is no
        # template value for it to mis-quote or word-split.
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref_name }}
        with:
          envs: EXPECTED_SHA,EXPECTED_REF
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Bumped from the 30s default: a slow handshake should wait, not fail.
          timeout: 120s
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}

      # The retry below used to fire ~2 min after the first attempt — inside the
      # same outage window — so both legs died together and the deploy shipped
      # nothing. Observed three times on 2026-08-19, each succeeding on a manual
      # re-run minutes later with nothing changed. The drops happen upstream of
      # the VPS: the errors quote the correct IP, ufw allows OpenSSH from
      # anywhere, fail2ban is not installed, and the box's own sshd journal has
      # no trace of the attempts. Waiting is the only lever we have from here.
      - name: Wait out the transient network window
        if: failure()
        run: sleep 240

      # appleboy/ssh-action does not retry a dropped/timed-out connection, and
      # this VPS has intermittently flaky inbound SSH (dial tcp :22 i/o timeout
      # while the box was healthy; a plain re-run succeeded immediately). The
      # deploy script is idempotent, so retry once to ride out transient blips.
      - name: Deploy via SSH (retry on transient failure)
        if: failure()
        id: deploy_retry
        uses: appleboy/ssh-action@v1
        # github.sha and github.ref_name reach the box through the action's
        # envs: input rather than being interpolated into the script text, so
        # the remote shell receives them as real variables and there is no
        # template value for it to mis-quote or word-split.
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref_name }}
        with:
          envs: EXPECTED_SHA,EXPECTED_REF
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}

      # --- Does the PUBLIC hostname serve this commit? ----------------------
      # The in-SSH assertion above reads the checkout directly. This reads it
      # again from the outside, through DNS, nginx and php-fpm.
      #
      # What it proves, precisely: the public name resolves, the web tier is up,
      # Laravel boots far enough to answer JSON, `config:cache` re-ran (env is
      # served from bootstrap/cache/config.php), and the checkout behind that
      # hostname contains this run's commit.
      #
      # What it does NOT prove: that the running bytecode is new.
      # App\Services\DeploymentIdentity reads .git/HEAD off the filesystem on
      # every request, so `commit` and `branch` describe exactly the same
      # checkout the in-SSH step just asserted — read a second time, through the
      # public edge. This is not an opcache or stale-bytecode check and must not
      # be read as one. Its real value is that the public hostname is alive,
      # boots, and is backed by the right checkout.
      #
      # It also cannot tell sibling deployments apart: api.lendyph.com,
      # api.binhs-coop.lendyph.com and api-lendyph.abedubas.dev all track `main`
      # and all report the same commit/branch/env, so a hostname misrouted to a
      # sibling on the same branch passes this step. Only the in-SSH check is
      # directory-specific.
      #
      # Gated on step OUTCOMES so it still runs when the first ssh leg failed
      # and the retry rescued the deploy, and is skipped when both legs failed
      # so it cannot bury the real error under a health failure.
      - name: Verify staging-api.lendyph.com serves this commit
        if: ${{ !cancelled() && (steps.deploy.outcome == 'success' || steps.deploy_retry.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_REF: ${{ github.ref_name }}
          HEALTH_HOST: staging-api.lendyph.com
          DEPLOY_BRANCH: development
          EXPECTED_ENV: staging
        run: |
          set -uo pipefail

          ATTEMPTS=6
          attempt=0

          while :; do
            attempt=$((attempt + 1))
            # Truncated before every attempt: curl leaves the output file untouched
            # when the connection never opens (DNS failure, TLS failure, timeout), so
            # without this the failure report would print the PREVIOUS attempt's body
            # and read as though the host had answered.
            : > "$RUNNER_TEMP/health.json"
            code=$(curl -sS --max-time 20 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' \
              "https://${HEALTH_HOST}/api/health") || code=000

            problem=""
            if [ "$code" != "200" ]; then
              problem="HTTP $code from https://${HEALTH_HOST}/api/health"
            else
              got_status=$(jq -r '.status // ""' "$RUNNER_TEMP/health.json" 2>/dev/null || true)
              got_branch=$(jq -r '.branch // ""' "$RUNNER_TEMP/health.json" 2>/dev/null || true)
              got_env=$(jq -r '.env // ""'    "$RUNNER_TEMP/health.json" 2>/dev/null || true)
              got_commit=$(jq -r '.commit // ""' "$RUNNER_TEMP/health.json" 2>/dev/null || true)

              if [ "$got_status" != "ok" ]; then
                problem="status is '${got_status}', expected 'ok'"
              elif [ "$got_branch" != "$DEPLOY_BRANCH" ]; then
                problem="branch is '${got_branch}', expected '${DEPLOY_BRANCH}'"
              elif [ "$got_env" != "$EXPECTED_ENV" ]; then
                # app()->environment() resolves from bootstrap/cache/config.php, so this
                # is also the one assertion here that `config:cache` actually re-ran.
                problem="env is '${got_env}', expected '${EXPECTED_ENV}'"
              elif [ "$EXPECTED_REF" != "$DEPLOY_BRANCH" ]; then
                # Same ref guard as the in-SSH step, for the same reason: dispatching from
                # the default branch `main` onto a directory that tracks `development`
                # means this run's commit is not in that history and never will be.
                echo "NOTE: this run is on '${EXPECTED_REF}' but ${HEALTH_HOST} tracks '${DEPLOY_BRANCH}';"
                echo "      commit containment is not assertable here and was asserted in-SSH instead."
                echo "ok: https://${HEALTH_HOST}/api/health -> ${got_commit} / ${got_branch} / ${got_env}"
                exit 0
              elif [ "$got_commit" = "${EXPECTED_SHA:0:7}" ]; then
                # Fast path, and the common one: no API call at all. /api/health reports a
                # 7-char short SHA, so this must compare against github.sha truncated to 7.
                echo "ok: https://${HEALTH_HOST}/api/health -> ${got_commit} / ${got_branch} / ${got_env} (this run's commit)"
                exit 0
              else
                # The box may legitimately be AHEAD (the branch tip moved between this run
                # being queued and the deploy running), so this is containment, not
                # equality — the same rule as the in-SSH ancestry check. The runner has no
                # clone to compute that locally (these jobs never run actions/checkout),
                # so it asks GitHub. Same idiom as fleet-drift-check.yml.
                rel=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${got_commit}" --jq .status 2>/dev/null || true)
                case "${rel:-}" in
                  ahead|identical)
                    echo "ok: https://${HEALTH_HOST}/api/health -> ${got_commit} / ${got_branch} / ${got_env} (${rel} of this run's ${EXPECTED_SHA:0:7}; the branch tip moved, which is allowed)"
                    exit 0
                    ;;
                  behind|diverged)
                    problem="serves ${got_commit}, which is '${rel}' relative to this run's ${EXPECTED_SHA:0:7} — it does not contain this commit"
                    ;;
                  *)
                    problem="could not compare ${got_commit} against ${EXPECTED_SHA:0:7} (GitHub compare returned '${rel:-<nothing>}')"
                    ;;
                esac
              fi
            fi

            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              echo "::error title=Post-deploy health check failed::${HEALTH_HOST}: ${problem}"
              echo "last response body (verbatim):"
              # `cat` on an empty file succeeds, so test for content first —
            # otherwise a connection that never opened prints a bare header.
            if [ -s "$RUNNER_TEMP/health.json" ]; then cat "$RUNNER_TEMP/health.json"; else echo "(no body captured)"; fi
              echo
              exit 1
            fi

            echo "attempt ${attempt}/${ATTEMPTS}: ${problem} — retrying in 10s"
            sleep 10
          done

      - name: Warn if the proxy secret was not delivered
        if: ${{ !cancelled() && steps.proxy_secret.outcome == 'failure' }}
        run: echo "::warning title=Proxy secret not delivered::The deploy ran with the box's previous proxy secret, or none (X-Forwarded-For stays untrusted)."
