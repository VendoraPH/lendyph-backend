name: Deploy Staging to VPS

# Auto-deploys the `staging` branch to the staging API instance
# (/var/www/api-lendyph-staging) on every push, mirroring the production deploy
# in deploy.yml. Gives the backend a deployed staging environment to match the
# frontend's `development` -> staging site.
on:
  push:
    branches: [staging]
    # CI-only changes (e.g. workflow edits) shouldn't trigger a staging deploy.
    paths-ignore: ['.github/**']

jobs:
  deploy:
    runs-on: ubuntu-latest

    # The on-VPS deploy script is defined once and reused by both the initial
    # attempt and the transient-failure retry below, so the two never drift.
    env:
      DEPLOY_SCRIPT: |
        set -e
        cd /var/www/api-lendyph-staging
        # Discard any local changes (e.g. regenerated api-docs.json) to avoid pull conflicts
        git fetch origin staging
        git reset --hard origin/staging
        COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction
        php artisan migrate --force
        # Symlink public/storage -> storage/app/public so uploaded photos and
        # valid-ID files are served at /storage/*. Idempotent; --force recreates a stale link.
        php artisan storage:link --force
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
        php artisan config:cache
        php artisan route:cache
        php artisan l5-swagger:generate
        chown -R www-data:www-data storage bootstrap/cache

        # Ensure Laravel scheduler cron is installed (idempotent). Guard on the
        # full `cd <path> &&` so it never collides with the production cron on
        # the same VPS — api-lendyph and api-lendyph-staging share one crontab.
        CRON_CMD="* * * * * cd /var/www/api-lendyph-staging && php artisan schedule:run >> /dev/null 2>&1"
        (crontab -l 2>/dev/null | grep -qF "cd /var/www/api-lendyph-staging &&" || (crontab -l 2>/dev/null; echo "$CRON_CMD") | crontab -)

        echo "Deployed staging at $(date)"

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Bumped from the 30s default: a slow handshake should wait, not fail.
          timeout: 120s
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}

      # appleboy/ssh-action does not retry a dropped/timed-out connection, and
      # the VPS has intermittently flaky inbound SSH (dial tcp :22 i/o timeout).
      # The deploy script is idempotent, so retry once to ride out transient blips.
      - name: Deploy via SSH (retry on transient failure)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 120s
          command_timeout: 20m
          script: ${{ env.DEPLOY_SCRIPT }}
